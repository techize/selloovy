name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Publication policy
        run: go run ./scripts/publicguard.go
      - name: Go formatting
        run: test -z "$(gofmt -l cmd internal scripts)"
      - name: Go verification
        run: |
          go mod verify
          go vet ./...
          go test -race ./...
          go build ./cmd/...
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history
        run: gitleaks git --log-opts=--all --redact --no-banner --ignore-gitleaks-allow
