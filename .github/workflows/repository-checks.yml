name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: selloovy
          POSTGRES_DB: selloovy_test
          # Ephemeral CI database containing synthetic fixtures only.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selloovy -d selloovy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SELLOOVY_TEST_DATABASE_URL: postgres://selloovy@127.0.0.1:5432/selloovy_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Publication policy
        run: go run ./scripts/publicguard.go
      - name: Go formatting
        run: test -z "$(gofmt -l cmd internal scripts db)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.5.0'
      - name: Frontend verification
        working-directory: web/admin
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
      - name: Verify generated queries
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- internal/authdb
      - name: Go verification
        run: |
          go mod verify
          go vet ./...
          go test -race ./...
          go build ./cmd/...
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history
        run: gitleaks git --log-opts=--all --redact --no-banner --ignore-gitleaks-allow
