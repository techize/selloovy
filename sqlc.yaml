version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/auth.sql"
    gen:
      go:
        package: "authdb"
        out: "internal/authdb"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/shop.sql"
    gen:
      go:
        package: "shopdb"
        out: "internal/shopdb"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/catalog.sql"
    gen:
      go:
        package: "catalogdb"
        out: "internal/catalogdb"
        sql_package: "pgx/v5"
